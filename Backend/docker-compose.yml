name: cafena

services:
  postgres:
    image: postgres:16-alpine
    container_name: cafena
    restart: always
    environment:
      POSTGRES_USER: cafena
      POSTGRES_PASSWORD: cafena123
      POSTGRES_DB: cafena_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
